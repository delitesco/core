name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CMAKE_POLICY_VERSION_MINIMUM: 3.5
  UV_VERSION: 0.7.13

jobs:
  # Ubuntu 22.04 like the Dockerfile: pyre2 0.3.6 does not build against the newer
  # libre2/abseil of 24.04, which need C++17.
  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install OS dependencies
        run: |
          sudo apt update
          sudo apt install -y libre2-dev libpq-dev

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Check formatting & linting
        run: uv run pre-commit run --all-files

  audit:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}

      - name: Check dependencies for known vulnerabilities
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project --format requirements-txt > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip

  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install OS dependencies
        run: |
          sudo apt update
          sudo apt install -y libre2-dev libpq-dev

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run db migration
        run: CONFIG=tests/test.env uv run alembic upgrade head

      - name: Prepare version file
        run: |
          scripts/generate-build-info.sh "${{ github.sha }}" "${{ github.ref_name }}"
          cat app/build_info.py

      - name: Test with pytest
        run: uv run pytest
        env:
          GITHUB_ACTIONS_TEST: true

  docker:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build the app and Postfix images (not pushed)
        run: |
          docker build -t delitesco-core:ci .
          docker build -t delitesco-postfix:ci deploy/postfix
