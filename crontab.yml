jobs:
  - name: delitesco Custom Domain check
    command: python /code/cron.py -j check_custom_domain
    shell: /bin/bash
    schedule: "15 */4 * * *"
    captureStderr: true
    concurrencyPolicy: Forbid
    onFailure:
      retry:
        maximumRetries: 10
        initialDelay: 1
        maximumDelay: 30
        backoffMultiplier: 2

  - name: delitesco HIBP check
    command: python /code/cron.py -j check_hibp
    shell: /bin/bash
    schedule: "13 */4 * * *"
    captureStderr: true
    concurrencyPolicy: Forbid
    onFailure:
      retry:
        maximumRetries: 10
        initialDelay: 1
        maximumDelay: 30
        backoffMultiplier: 2

  - name: delitesco Notify HIBP breaches
    command: python /code/cron.py -j notify_hibp
    shell: /bin/bash
    schedule: "15 4 * * *"
    captureStderr: true
    concurrencyPolicy: Forbid


  - name: delitesco Delete Logs
    command: python /code/cron.py -j delete_logs
    shell: /bin/bash
    schedule: "15 5 * * *"
    captureStderr: true

  - name: delitesco Delete Old data
    command: python /code/cron.py -j delete_old_data
    shell: /bin/bash
    schedule: "30 5 * * *"
    captureStderr: true

  - name: delitesco delete users scheduled to be deleted
    command: python /code/cron.py -j delete_scheduled_users
    shell: /bin/bash
    schedule: "15 11 * * *"
    captureStderr: true
    concurrencyPolicy: Forbid

  - name: delitesco send unsent emails
    command: python /code/cron.py -j send_undelivered_mails
    shell: /bin/bash
    schedule: "*/5 * * * *"
    captureStderr: true
    concurrencyPolicy: Forbid

  - name: delitesco clear alias_audit_log old entries
    command: python /code/cron.py -j clear_alias_audit_log
    shell: /bin/bash
    schedule: "0 * * * *" # Once every hour
    captureStderr: true
    concurrencyPolicy: Forbid

  - name: delitesco clear user_audit_log old entries
    command: python /code/cron.py -j clear_user_audit_log
    shell: /bin/bash
    schedule: "0 * * * *" # Once every hour
    captureStderr: true
    concurrencyPolicy: Forbid

  - name: delitesco clear alias pending to be deleted
    command: python /code/cron.py -j clear_alias_delete_on
    shell: /bin/bash
    schedule: "0 * * * *" # Once every hour
    captureStderr: true
    concurrencyPolicy: Forbid

  - name: delitesco abuse report
    command: python /code/cron.py -j abuse_report
    shell: /bin/bash
    schedule: "0 6 * * *"
    captureStderr: true
    concurrencyPolicy: Forbid
