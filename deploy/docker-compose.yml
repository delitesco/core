# Everything delitesco-core needs on one server: copy .env.example to .env, fill it in,
# then `docker compose up -d --build`. See README.md in this directory.

x-app: &app
  build:
    context: ..
  image: ${DELITESCO_IMAGE:-delitesco-core}:${DELITESCO_VERSION:-latest}
  restart: unless-stopped
  env_file: ${ENV_FILE:-.env}
  # repeated from .env, already expanded, so the containers never see a literal "$DOMAIN"
  environment:
    EMAIL_DOMAIN: ${EMAIL_DOMAIN:-${DOMAIN}}
    URL: ${URL}
    SUPPORT_EMAIL: ${SUPPORT_EMAIL}
    # custom domains point their MX here: the mail server's own name
    EMAIL_SERVERS_WITH_PRIORITY: '[(10, "${MAIL_HOSTNAME:-mail.${EMAIL_DOMAIN:-${DOMAIN}}}.")]'
    DB_URI: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@sl-db:5432/${POSTGRES_DB:?}
    MEM_STORE_URI: redis://sl-redis:6379
    # Postfix's name on the mail-out network: mail sent there comes from this
    # container's mail-out address, the only one Postfix relays for
    POSTFIX_SERVER: postfix-relay
    # paths inside the sl-data volume; fixed so that values from an old SimpleLogin .env
    # (e.g. DKIM_PRIVATE_KEY_PATH=/dkim.key) cannot point outside it
    DKIM_PRIVATE_KEY_PATH: /sl/dkim.key
    GNUPGHOME: /sl/pgp
    UPLOAD_DIR: /sl/upload
    MAILBOX_VERIFY_URL: ${MAILBOX_VERIFY_URL:-}
    UNSUBSCRIBER: ${UNSUBSCRIBER:-}
    # who may call /api/provision/*; by default the same addresses as the whole API
    PROVISIONING_ALLOWED_IPS: ${PROVISIONING_ALLOWED_IPS:-${API_ALLOWED_IPS}}
  volumes:
    - sl-data:/sl
  networks: [delitesco, mail-out]
  depends_on:
    sl-init:
      condition: service_completed_successfully
    sl-redis:
      condition: service_started

services:
  sl-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - sl-db-data:/var/lib/postgresql/data
    networks: [delitesco]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  sl-redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [delitesco]

  # migrations, DKIM key, alias domains; runs once on each `up`. The only service that
  # runs as root: it hands the data volume over to the unprivileged user of the image.
  sl-init:
    <<: *app
    restart: "no"
    user: "0:0"
    command: ["sh", "/code/deploy/init.sh"]
    depends_on:
      sl-db:
        condition: service_healthy

  # HTTP API, published over HTTPS by Traefik on https://$SUBDOMAIN.$DOMAIN
  sl-app:
    <<: *app
    command: ["gunicorn", "wsgi:app", "-b", "0.0.0.0:7777", "-w", "2", "--timeout", "15"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7777/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.sl-app.rule=Host(`${SUBDOMAIN}.${DOMAIN}`)
      - traefik.http.routers.sl-app.entrypoints=websecure
      - traefik.http.routers.sl-app.tls.certresolver=le
      - traefik.http.routers.sl-app.middlewares=sl-app-allow
      - traefik.http.middlewares.sl-app-allow.ipallowlist.sourcerange=${API_ALLOWED_IPS:?set API_ALLOWED_IPS in .env to the frontend backend address}
      - traefik.http.services.sl-app.loadbalancer.server.port=7777

  sl-email:
    <<: *app
    command: ["python", "email_handler.py", "-p", "20381"]

  sl-job-runner:
    <<: *app
    command: ["python", "job_runner.py"]

  sl-cron:
    <<: *app
    command: ["yacron", "-c", "/code/crontab.yml"]

  postfix:
    build:
      context: ./postfix
    image: delitesco-postfix:${DELITESCO_VERSION:-latest}
    restart: unless-stopped
    environment:
      # the alias domain, and the name this server uses in SMTP (HELO, banner, certificate)
      DOMAIN: ${EMAIL_DOMAIN:-${DOMAIN}}
      APP_HOSTNAME: ${MAIL_HOSTNAME:-mail.${EMAIL_DOMAIN:-${DOMAIN}}}
      POSTGRES_HOST: sl-db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      EMAIL_HANDLER: sl-email:20381
      # Postfix relays outgoing mail only for the app containers, on the mail-out network
      # (Traefik, the socket proxy etc. are not on it). Keep in sync with "networks" below.
      DOCKER_SUBNET: 10.78.0.0/24
      DOCKER_GATEWAY: 10.78.0.1
      SPAMHAUS_DQS_KEY: ${SPAMHAUS_DQS_KEY:-}
      # written by certs-dumper from Traefik's Let's Encrypt certificate
      TLS_CERT: /certs/${MAIL_HOSTNAME:-mail.${EMAIL_DOMAIN:-${DOMAIN}}}/certificate.pem
      TLS_KEY: /certs/${MAIL_HOSTNAME:-mail.${EMAIL_DOMAIN:-${DOMAIN}}}/privatekey.pem
    ports:
      - "25:25"
    volumes:
      - postfix-queue:/var/spool/postfix
      - certs:/certs:ro
    networks:
      delitesco: {}
      mail-out:
        aliases: [postfix-relay]
    depends_on:
      sl-db:
        condition: service_healthy
      sl-email:
        condition: service_started

  # Gives Traefik read-only access to the container list, instead of the Docker socket
  # itself (which is root on the host). Reachable only from Traefik.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]

  traefik:
    image: traefik:v3.6.2
    restart: unless-stopped
    # Only Traefik's own settings: the DNS provider credentials for LE_CHALLENGE=dns go in
    # traefik.env (see traefik.env.example). The app secrets in .env never reach Traefik.
    env_file:
      - path: ${TRAEFIK_ENV_FILE:-traefik.env}
        required: false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ "$${LE_CHALLENGE:-tls}" = "dns" ]; then
          CHALLENGE="--certificatesresolvers.le.acme.dnschallenge.provider=$${LE_DNS_PROVIDER}"
        else
          CHALLENGE="--certificatesresolvers.le.acme.tlschallenge=true"
        fi
        exec traefik \
          --providers.docker=true \
          --providers.docker.endpoint=tcp://docker-socket-proxy:2375 \
          --providers.docker.exposedbydefault=false \
          --providers.docker.network=delitesco \
          --entrypoints.web.address=:80 \
          --entrypoints.web.http.redirections.entrypoint.to=websecure \
          --entrypoints.websecure.address=:443 \
          --certificatesresolvers.le.acme.email="$${LE_EMAIL}" \
          --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json \
          $$CHALLENGE
    environment:
      LE_EMAIL: ${LE_EMAIL:-${SUPPORT_EMAIL}}
      LE_CHALLENGE: ${LE_CHALLENGE:-tls}
      LE_DNS_PROVIDER: ${LE_DNS_PROVIDER:-}
    # a router that serves nothing, only so that Traefik gets a certificate for the
    # mail server's name (Postfix STARTTLS, via certs-dumper)
    labels:
      - traefik.enable=true
      - traefik.http.routers.mail-cert.rule=Host(`${MAIL_HOSTNAME:-mail.${EMAIL_DOMAIN:-${DOMAIN}}}`)
      - traefik.http.routers.mail-cert.entrypoints=websecure
      - traefik.http.routers.mail-cert.tls.certresolver=le
      - traefik.http.routers.mail-cert.service=noop@internal
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik-acme:/letsencrypt
    networks: [delitesco, docker-api]
    depends_on:
      - docker-socket-proxy

  # copies Traefik's certificate to files Postfix uses for STARTTLS
  certs-dumper:
    image: ldez/traefik-certs-dumper:v2.8.3
    restart: unless-stopped
    command: >
      file --version v2 --watch --source /letsencrypt/acme.json --dest /certs
      --domain-subdir --crt-ext=.pem --key-ext=.pem
    volumes:
      - traefik-acme:/letsencrypt:ro
      - certs:/certs
    depends_on:
      - traefik

networks:
  # no outside access: only Traefik and the socket proxy
  docker-api:
    internal: true
  # the app containers and Postfix: Postfix relays outgoing mail for this subnet only
  mail-out:
    name: delitesco-mail-out
    ipam:
      config:
        - subnet: 10.78.0.0/24
          gateway: 10.78.0.1
  delitesco:
    name: delitesco
    ipam:
      config:
        - subnet: 10.77.0.0/24
          gateway: 10.77.0.1

volumes:
  sl-db-data:
  sl-data:
  postfix-queue:
  traefik-acme:
  certs:
